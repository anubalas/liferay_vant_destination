version: '3.8'

services:
  iot-monitoring:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: h2:latest
    ports:
      - "8082:8082"
    environment:
      H2_OPTIONS: '-tcp -tcpAllowOthers -ifNotExists'
    volumes:
      - h2-data:/data

volumes:
  h2-data:
